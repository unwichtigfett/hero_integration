# Bench-native install test.  Logic lives in ci/bench-install-test.sh.
# Draft: adapt the image to one with Python 3.14, Node 20+, yarn, git, mariadb client and bench.
when:
  - event: [manual, push]
    branch: [hero_int_1.0]

services:
  - name: mariadb
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ci-root
  - name: redis
    image: redis:7-alpine

steps:
  - name: install-test
    image: frappe-ci:py314   # prebuilt image on the CI server (see docs/ci_installtest_1.0.md)
    environment:
      DB_HOST: mariadb
      DB_ROOT_PASSWORD: ci-root
      REDIS_CACHE: redis://redis:6379
      WORKDIR: /tmp/ci-bench
      HERO_CONFIG_FILE:
        from_secret: hero_config_file_path
      HERO_SCHEMA_FILE:
        from_secret: hero_schema_file_path
    commands:
      - ci/bench-install-test.sh
