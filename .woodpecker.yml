# Release chain for a push to hero_int_dev:
#   GitHub CI (package, install-test) -> Woodpecker install test
#   -> promote: raise the patch version, fast-forward hero_int_1.0, tag v<version>.
# Any failure stops the chain; hero_int_1.0 then keeps its state.
# Release commits carry "[skip ci]", so the promotion push starts no new pipeline.
# The logic lives in ci/*.sh.
#
# The complete package export (it contains the HERO schema snapshot) is not in the
# repository. Put it on the CI server as /srv/hero-ci/hero-integration-config.json.
# The repository must be "trusted" in Woodpecker so the read-only volume can be mounted.
when:
  - event: [manual, push]
    branch: [hero_int_dev, hero_int_1.0]

services:
  - name: mariadb
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ci-root
  - name: redis
    image: redis:7-alpine

steps:
  - name: wait-github
    depends_on: []
    image: alpine:3.22.2@sha256:4b7ce07002c69e8f3d704a9c5d6fd3053be500b7f1c69fc0d80990c2ad8dd412
    commands:
      - apk add --no-cache -q curl jq
      - sh ci/wait-github-checks.sh

  - name: install-test
    depends_on: [wait-github]
    image: frappe-ci:py314   # prebuilt image on the CI server
    volumes:
      - /srv/hero-ci:/hero-ci:ro
    environment:
      DB_HOST: mariadb
      DB_ROOT_PASSWORD: ci-root
      REDIS_CACHE: redis://redis:6379
      WORKDIR: /tmp/ci-bench
    commands:
      - if [ -s /hero-ci/hero-schema.json ]; then export HERO_SCHEMA_FILE=/hero-ci/hero-schema.json; fi
      - if [ -s /hero-ci/hero-integration-config.json ]; then export HERO_CONFIG_FILE=/hero-ci/hero-integration-config.json; fi
      - ci/bench-install-test.sh

  # Push to hero_int_dev only, after every earlier gate succeeded.
  - name: promote
    depends_on: [install-test]
    image: alpine:3.22.2@sha256:4b7ce07002c69e8f3d704a9c5d6fd3053be500b7f1c69fc0d80990c2ad8dd412
    when:
      - event: push
        branch: hero_int_dev
    environment:
      GITHUB_REMOTE: https://github.com/unwichtigfett/hero_integration.git
      GITHUB_TOKEN:
        from_secret: github_release_token
    commands:
      - apk add --no-cache -q bash git
      - bash ci/promote-release.sh
