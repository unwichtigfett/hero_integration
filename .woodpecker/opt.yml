# Opt architecture workflow: isolated from the standard test-site updater.
when:
  - event: [manual, push]
    branch: [hero_int_dev_opt, hero_int_opt]

services:
  - name: mariadb
    image: mariadb:11.4
    environment:
      MARIADB_ROOT_PASSWORD: ci-root
  - name: redis
    image: redis:7-alpine

steps:
  - name: wait-github
    depends_on: []
    image: alpine:3.22.2@sha256:4b7ce07002c69e8f3d704a9c5d6fd3053be500b7f1c69fc0d80990c2ad8dd412
    commands:
      - apk add --no-cache -q curl jq
      - sh ci/wait-github-checks.sh

  - name: install-test
    depends_on: [wait-github]
    image: frappe-ci:py314   # prebuilt image on the CI server
    volumes:
      - /srv/hero-ci:/hero-ci:ro
    environment:
      DB_HOST: mariadb
      DB_ROOT_PASSWORD: ci-root
      REDIS_CACHE: redis://redis:6379
      WORKDIR: /tmp/ci-bench
    commands:
      - if [ -s /hero-ci/hero-schema.json ]; then export HERO_SCHEMA_FILE=/hero-ci/hero-schema.json; fi
      - if [ -s /hero-ci/hero-integration-config.json ]; then export HERO_CONFIG_FILE=/hero-ci/hero-integration-config.json; fi
      - ci/opt-install-test.sh

  # Optimization releases use their own branch and tag namespace. The shared
  # VPS2 test-site updater remains exclusive to the standard development lane.
  - name: promote-opt
    depends_on: [install-test]
    image: alpine:3.22.2@sha256:4b7ce07002c69e8f3d704a9c5d6fd3053be500b7f1c69fc0d80990c2ad8dd412
    when:
      - event: push
        branch: hero_int_dev_opt
    environment:
      GITHUB_REMOTE: https://github.com/unwichtigfett/hero_integration.git
      GITHUB_TOKEN:
        from_secret: github_release_token
    commands:
      - apk add --no-cache -q bash git
      - bash ci/promote-release.sh

  # Manual opt-in only; all existing push promotions remain unchanged.
  - name: promote-candidate
    depends_on: [install-test]
    image: alpine@sha256:4b7ce07002c69e8f3d704a9c5d6fd3053be500b7f1c69fc0d80990c2ad8dd412
    when:
      - event: manual
        branch: hero_int_dev_opt
        evaluate: 'CI_COMMIT_MESSAGE matches "^(MANUAL: )?-canidate([[:space:]]|$)"'
    environment:
      GITHUB_REMOTE: https://github.com/unwichtigfett/hero_integration.git
      GITHUB_TOKEN:
        from_secret: github_candidate_token
    commands:
      - apk add --no-cache -q bash git
      - bash ci/promote-candidate.sh
