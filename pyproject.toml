[project]
name = "hero_integration"
version = "1.0.14"
description = "Native Frappe v16 integration for HERO"
readme = "README.md"
requires-python = ">=3.14,<3.15"
license = {file = "LICENSE"}
authors = [{name = "unwichtigfett", email = "95431041+unwichtigfett@users.noreply.github.com"}]
maintainers = [{name = "unwichtigfett", email = "95431041+unwichtigfett@users.noreply.github.com"}]
dependencies = ["graphql-core>=3.2,<3.3"]

[project.optional-dependencies]
# Some test modules use pytest; Frappe's test discovery imports every test module.
test = ["pytest>=8", "unittest-xml-reporting>=3.2,<4"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["hero_integration*"]

[tool.setuptools.package-data]
hero_integration = ["modules.txt", "**/*.json", "**/*.js", "**/*.css", "translations/*.csv"]

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0-dev,<17.0.0"

[tool.ruff]
line-length = 110
target-version = "py310"
