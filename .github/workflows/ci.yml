name: CI

on:
  pull_request:
  push:
    branches:
      - release/v1-rc

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pip build
      - run: python -m compileall -q hero_integration
      - run: python -m build
